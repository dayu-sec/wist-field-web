server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：/api 是 JSON（资产拓扑一张图就是几百 KB~几 MB）。
    # `gzip_proxied any` 是关键 —— 默认 `off` 只压缩 nginx 自己的响应，
    # 反代过来的 JSON 会原样裸传；跨 VPN 打开拓扑页慢，一半时间耗在这上面。
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/javascript text/css
               text/plain text/xml application/xml image/svg+xml;

    # 容器重建后 IP 会变。`proxy_pass http://field-api:8080` 这种写法只在**启动时**解析一次，
    # 上游一重建，这里就会拿着旧 IP 回 404/502（症状：页面能开、所有 /api 挂掉）。
    # 用变量 + resolver 让 nginx 按 TTL 重新解析（Docker 内嵌 DNS：127.0.0.11）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 容器健康检查专用，不打后端。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # BFF：浏览器只跟本容器说话。
    #
    # 身份（VPN/堡垒机 + mTLS）由**入口**终结，注入到请求头里；
    # 本容器不持有证据服务的客户端证书，也不直接连证据服务。
    location /api {
        set $field_api_upstream field-api:8080;
        proxy_pass http://$field_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # SPA 路由回退。图标与入口 HTML 不缓存（换版本后要能立刻拿到新 bundle）。
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
